<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <title>访客注册 - 校园参观预约与智能咨询系统</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    .reg-page {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 40px 16px;
    }

    .reg-card {
      position: relative;
      z-index: 2;
      width: 480px;
      padding: 40px;
      background: rgba(255, 255, 255, 0.98);
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .reg-title {
      text-align: center;
      font-size: 22px;
      font-weight: 600;
      color: #303133;
      margin-bottom: 32px;
    }

    .reg-form .form-group {
      margin-bottom: 18px;
    }

    .reg-form .form-group label {
      display: block;
      font-size: 13px;
      color: #606266;
      margin-bottom: 8px;
      font-weight: 500;
    }

    .reg-form .form-group input {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid #DCDFE6;
      border-radius: 6px;
      font-size: 14px;
      outline: none;
      transition: all .2s;
      box-sizing: border-box;
    }

    .reg-form .form-group input:focus {
      border-color: #409EFF;
      box-shadow: 0 0 0 3px rgba(64, 158, 255, 0.15);
    }

    .reg-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #409EFF 0%, #667eea 100%);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      margin-top: 8px;
    }

    .reg-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(64, 158, 255, 0.4);
    }

    .reg-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: #909399;
    }

    .reg-footer a {
      color: #409EFF;
    }

    .brand-logo {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #409EFF 0%, #667eea 100%);
      border-radius: 50%;
      margin: 0 auto 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 24px;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="page-wrapper page-wrapper--gradient reg-page">
    <div class="reg-card">
      <div class="brand-logo">册</div>
      <div class="reg-title">访客注册</div>

      <form class="reg-form" onsubmit="event.preventDefault(); window.location.href='登录.html'">
        <div class="form-group">
          <label>用户名</label>
          <input type="text" placeholder="4-20 位字母数字下划线">
        </div>
        <div class="form-group">
          <label>密码</label>
          <input type="password" placeholder="6-20 位含字母数字">
        </div>
        <div class="form-group">
          <label>确认密码</label>
          <input type="password" placeholder="再次输入密码">
        </div>
        <div class="form-group">
          <label>真实姓名</label>
          <input type="text" placeholder="2-10 字">
        </div>
        <div class="form-group">
          <label>手机号</label>
          <input type="text" placeholder="11 位手机号">
        </div>
        <button type="submit" class="reg-btn">注 册</button>
      </form>

      <div class="reg-footer">已有账号？<a href="登录.html">返回登录</a></div>
    </div>
  </div>
</body>

</html>
