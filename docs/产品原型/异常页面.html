<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>异常页面 - 校园参观预约与智能咨询系统</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    .state-container { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #f5f7fa; }
    .state-content { text-align: center; }
  </style>
</head>
<body>
  <div class="state-container">
    <div class="state-content">
      <div style="font-size:80px;color:#F56C6C">⚠️</div>
      <h1 style="font-size:48px;color:#303133;margin:16px 0">服务器开小差了</h1>
      <p style="color:#909399;margin-bottom:24px">500 Internal Server Error</p>
      <div class="flex gap-8" style="justify-content:center">
        <button class="btn btn-primary" onclick="location.reload()">重试</button>
        <a href="访客首页.html" class="btn">返回首页</a>
      </div>
    </div>
  </div>

  <div style="max-width:1000px;margin:24px auto;padding:0 24px">
    <div class="card">
      <div class="card-title">常见异常场景</div>
      <table class="table">
        <thead>
          <tr><th>场景</th><th>提示文案</th><th>处理方式</th></tr>
        </thead>
        <tbody>
          <tr><td>网络异常</td><td>网络异常，请稍后重试</td><td>顶部 ElMessage 提示</td></tr>
          <tr><td>请求超时</td><td>请求超时</td><td>顶部 ElMessage 提示</td></tr>
          <tr><td>接口 404</td><td>接口不存在</td><td>顶部 ElMessage 提示</td></tr>
          <tr><td>接口 500</td><td>服务器异常</td><td>跳此异常页</td></tr>
          <tr><td>JWT 失效</td><td>未登录或登录已过期</td><td>清 token + 跳登录页</td></tr>
          <tr><td>Milvus 异常</td><td>知识库服务异常，请稍后重试</td><td>AI 咨询弹窗内提示</td></tr>
          <tr><td>大模型调用失败</td><td>AI 调用超时，请稍后重试</td><td>AI 咨询弹窗内提示</td></tr>
          <tr><td>文档解析失败</td><td>文档解析失败，请检查文件格式</td><td>上传弹窗内提示，回滚不污染向量库</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
