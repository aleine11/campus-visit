<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>空数据 - 校园参观预约与智能咨询系统</title>
  <link rel="stylesheet" href="css/common.css">
  <style>
    .state-container { min-height: 100vh; display: flex; justify-content: center; align-items: center; background: #f5f7fa; }
    .state-content { text-align: center; }
    .empty-illustration { font-size: 80px; color: #c0c4cc; }
  </style>
</head>
<body>
  <div class="state-container">
    <div class="state-content">
      <div class="empty-illustration">📭</div>
      <h2 style="color:#606266;margin:16px 0">暂无数据</h2>
      <p style="color:#909399;margin-bottom:24px">当前页面没有可显示的数据</p>
      <a href="项目说明.html" class="btn btn-primary">返回项目说明</a>
    </div>
  </div>

  <div style="max-width:1000px;margin:24px auto;padding:0 24px">
    <div class="card">
      <div class="card-title">各种空数据场景示例</div>
      <div class="grid-3">
        <div class="card" style="padding:24px;text-align:center;background:#f5f7fa">
          <div style="font-size:48px;color:#c0c4cc">📋</div>
          <p style="color:#909399;margin-top:8px">列表无数据（如：访客无预约记录）</p>
        </div>
        <div class="card" style="padding:24px;text-align:center;background:#f5f7fa">
          <div style="font-size:48px;color:#c0c4cc">🔍</div>
          <p style="color:#909399;margin-top:8px">搜索无结果</p>
        </div>
        <div class="card" style="padding:24px;text-align:center;background:#f5f7fa">
          <div style="font-size:48px;color:#c0c4cc">📭</div>
          <p style="color:#909399;margin-top:8px">无公告 / 无场次 / 无聊天记录</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
