# 生产环境配置 - 部署时通过环境变量注入
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://127.0.0.1:3306/campus_visit?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl  # 生产关闭 SQL 日志

campus:
  jwt:
    secret: ${JWT_SECRET}
  dashscope:
    api-key: ${DASHSCOPE_API_KEY}

logging:
  level:
    com.campus.visit: info
